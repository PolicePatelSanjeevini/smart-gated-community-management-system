spring:
  profiles:
    active: dev
  application:
    name: smart-community-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d7e1b5a3f6c8d2e4f1a7b9c3d5e8f0a2b4c6d8e1f3a5b7c9d0e2f4a6b}
    expiration-milliseconds: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
